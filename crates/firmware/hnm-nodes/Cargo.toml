# === Package === #

[package]
name = "hnm-nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# === Package Targets === #

[[bin]]
name = "hnm-node-gateway"
path = "src/bin/gateway.rs"
required-features = ["firmware"]

[[bin]]
name = "hnm-node-rotator"
path = "src/bin/rotator.rs"
required-features = ["firmware"]

[[bin]]
name = "hnm-node-sidecar"
path = "src/bin/sidecar.rs"
required-features = ["firmware"]

# === Features === #

[features]
default = []
firmware = []
hardware-unknown = []

# === Dependencies === #

[dependencies]
# Local
hnm = { workspace = true, features = ["firmware"] }
hnm-core = { workspace = true }
hnm-drivers = { workspace = true }
hnm-protocol = { workspace = true }

# Git

# Error Handling
thiserror = { workspace = true }

# Logging
defmt = { workspace = true }

# Utilities
heapless = { workspace = true }

# Serialization

# Configuration

# Filesystem

# Parsing

# Concurrency

# Async
embassy-sync = { workspace = true }
embassy-time = { workspace = true }

# Networking

# Storage

# UI

# Testing

