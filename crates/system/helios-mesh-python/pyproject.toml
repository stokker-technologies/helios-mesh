[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "helios-mesh"
description = "Typed Python bindings for Helios Mesh."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = []

[dependency-groups]
dev = ["basedpyright==1.39.10", "maturin>=1.9,<2.0", "mypy==1.20.2", "pytest>=9.0,<10.0", "ruff>=0.14,<1.0"]

[tool.maturin]
exclude = ["**/__pycache__/**", "**/*.pyc"]
python-source = "python"
module-name = "helios_mesh._native"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["helios_mesh"]

[tool.basedpyright]
include = ["python/helios_mesh", "tests", "examples"]
extraPaths = ["python"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnusedCallResult = "error"
reportMissingModuleSource = false
venv = ".venv"
# Share The Repository Environment With Tooling And Native Binding Checks.
venvPath = "../../.."
