# === Settings === #

[settings]
jobs = 1
lockfile = true

# === Tools === #

[tools]
# Languages And Runtimes
go = "1.27.3"
node = "26.11.1"
python = "3.15.0"
rust = { version = "1.99.0", components = "clippy,rustfmt,llvm-tools", profile = "minimal", targets = "thumbv6m-none-eabi" }

# Package Managers
uv = "0.13.0"

# Rust Toolchain
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.148"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"github:bnjbvr/cargo-machete" = "0.9.2"
sccache = "0.18.0"

# Formatting And Linting
"aqua:koalaman/shellcheck" = "0.11.0"
"go:github.com/rhysd/actionlint/cmd/actionlint" = "v1.7.13-0.20260417151945-fd33e9f582a0"
"npm:@fission-ai/openspec" = "1.14.3"
taplo = "0.10.0"

# Release And Signing
gh = "2.102.0"
git-cliff = "2.14.2"
glab = "1.123.0"

# Project Statistics
"aqua:boyter/scc" = "4.1.0"

# === Environment === #

[env]

# === Variables === #

[vars]

# === Prepare === #

[tasks.prepare]
description = "Prepare Tools And Inputs"
run = ["rustup target add thumbv6m-none-eabi", "uv sync --locked --project tools/python --all-groups"]

# === Format === #

[tasks.format]
description = "Format Every Language"
usage = 'flag "--check"'
depends = [
  "format:toml {% if usage.check %}--check{% endif %}",
  "format:rust {% if usage.check %}--check{% endif %}",
  "format:python {% if usage.check %}--check{% endif %}",
]

[tasks."format:python"]
description = "Format Python"
usage = 'flag "--check"'
run = 'uv run --locked --project tools/python ruff format "tools/python" "crates/system/helios-mesh-python"{% if usage.check %} --check{% endif %}'

[tasks."format:rust"]
description = "Format Rust"
usage = 'flag "--check"'
run = "cargo fmt --all{% if usage.check %} --check{% endif %}"

[tasks."format:toml"]
description = "Format TOML"
usage = 'flag "--check"'
run = "git ls-files -z -- '*.toml' | xargs -0 taplo fmt --option column_width=140{% if usage.check %} --check{% endif %}"
run_windows = "powershell -NoProfile -Command \"$files = @(git ls-files -- '*.toml'); if ($files.Count -gt 0) { & taplo fmt --option column_width=140{% if usage.check %} --check{% endif %} -- @files; exit $LASTEXITCODE }\""

# === Lint === #

[tasks.lint]
description = "Lint Every Language"
depends = ["lint:rust", "lint:python"]

[tasks."lint:python"]
description = "Lint Python"
run = [
  'uv run --locked --project tools/python ruff check "tools/python" "crates/system/helios-mesh-python"',
  'uv run --locked --project tools/python ty check tools/python',
  'uv run --locked --project tools/python --group test basedpyright --project crates/system/helios-mesh-python/pyproject.toml',
]

[tasks."lint:rust"]
description = "Lint Rust"
run = [
  "cargo clippy --locked --workspace --exclude helios-mesh-nodes --all-targets --all-features -- -D warnings",
  "cargo clippy --locked --package helios-mesh-nodes --lib --all-features -- -D warnings",
  "cargo clippy --locked --package helios-mesh-nodes --bins --target thumbv6m-none-eabi --features firmware -- -D warnings",
]

# === Check === #

[tasks.check]
description = "Check Rust Feature Proofs And Conventions"
run = [{ task = "check:repository" }, { task = "check:rust" }, { task = "check:python" }]

[tasks."check:python"]
description = "Check Python"
run = [{ task = "format:python --check" }, { task = "lint:python" }]

[tasks."check:python:generated"]
description = "Verify Native Python Exports Against Stubs"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.test.bindings --profile {{usage.profile}}"
env = { CARGO_INCREMENTAL = "0" }

[tasks."check:repository"]
description = "Check Repository Configuration And Conventions"
run = [
  { task = "format:toml --check" },
  "uv run --locked --project tools/python python -m helios_mesh_tools.stkr --optional project check",
  "shellcheck --version",
  "actionlint",
]

[tasks."check:rust"]
description = "Check Rust"
run = [
  { task = "format:rust --check" },
  { task = "lint:rust" },
  "cargo-machete --skip-target-dir",
  "cargo check --locked --workspace --exclude helios-mesh-nodes --all-targets --all-features",
  "cargo check --locked --workspace --exclude helios-mesh-nodes --all-targets --no-default-features",
  "cargo check --locked --package helios-mesh --all-targets --all-features",
  "cargo check --locked --package helios-mesh --all-targets --no-default-features",
  "cargo check --locked --package helios-mesh-nodes --lib --all-features",
  "cargo check --locked --package helios-mesh-nodes --lib --no-default-features",
  "cargo check --locked --package helios-mesh-nodes --bins --target thumbv6m-none-eabi --all-features",
  "cargo check --locked --package helios-mesh-nodes --bins --target thumbv6m-none-eabi --no-default-features --features firmware",
]

# === Build === #

[tasks.build]
description = "Build Native Products, Wheels And Linux Firmware"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"; flag "--hardware-unknown"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.build.product --profile {{usage.profile}} {% if usage.hardware_unknown %}--hardware-unknown{% endif %}"

[tasks."build:rust:tests"]
description = "Build The Shared Test Archive And Fixtures"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.build.tests --profile {{usage.profile}}"

# === Dev === #

[tasks."dev:cli"]
description = "Run The Helios Mesh Command-Line Interface"
run = "cargo run --locked --package helios-mesh-cli --"

[tasks."dev:python"]
description = "Install The Python Extension For Local Development"
run = "uv run --locked --project tools/python maturin develop --manifest-path crates/system/helios-mesh-python/Cargo.toml --uv"

# === Test === #

[tasks.test]
description = "Test Every Language"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:python --profile {{usage.profile}}", "test:rust --profile {{usage.profile}}"]

[tasks."test:python"]
description = "Test Python"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["test:python:acceptance --profile {{usage.profile}}"]

[tasks."test:python:acceptance"]
description = "Test Installed Python Distribution"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python --group test python -m helios_mesh_tools.test.run test --profile {{usage.profile}} --category acceptance --language python --project crates/system/helios-mesh-python"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:python:coverage"]
description = "Measure Python Coverage Over Instrumented Lanes"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.test.run coverage --language python --profile {{usage.profile}}"

[tasks."test:rust"]
description = "Test Rust"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
depends = [
  "test:rust:acceptance --profile {{usage.profile}}",
  "test:rust:integration --profile {{usage.profile}}",
  "test:rust:unit --profile {{usage.profile}}",
]

[tasks."test:rust:acceptance"]
description = "Test CLI Acceptance"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.test.run test --profile {{usage.profile}} --category acceptance --language rust"

[tasks."test:rust:coverage"]
description = "Measure Rust Coverage Over Instrumented Lanes"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.test.run coverage --language rust --profile {{usage.profile}}"

[tasks."test:rust:unit"]
description = "Test Unit Rust"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.test.run test --profile {{usage.profile}} --category unit --language rust"
env = { CARGO_INCREMENTAL = "0" }

[tasks."test:rust:integration"]
description = "Test Integration Rust"
env.CARGO_INCREMENTAL = "0"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.test.run test --profile {{usage.profile}} --category integration --language rust"

# === Bench === #

# === Docs === #

# === Package === #

[tasks.package]
description = "Package Every Language"
usage = 'flag "--profile <profile>" default="dev"'
depends = ["package:rust --profile {{usage.profile}}", "package:python --profile {{usage.profile}}"]

[tasks."package:python"]
description = "Package Python"
usage = 'flag "--profile <profile>" default="dev"'
run = "uv run --locked --project tools/python python -m helios_mesh_tools.package.product --language python --profile {{usage.profile}}"

[tasks."package:rust"]
description = "Package Rust"
tools."cargo:elf2uf2-rs" = { version = "2.2.0", os = ["linux"] }
usage = 'flag "--profile <profile>" default="dev"'
run = ["uv run --locked --project tools/python python -m helios_mesh_tools.package.product --language rust --profile {{usage.profile}}"]

# === CI === #

# === Release === #

[tasks."release:prepare"]
description = "Prepare The Release Branch"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run prepare"

[tasks."release:publish"]
description = "Publish A Tagged Release"
run = [{ task = "release:publish:assets" }, { task = "release:publish:python" }, { task = "release:publish:finalize" }]

[tasks."release:publish:assets"]
description = "Draft The Release With Its Signed Assets"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run publish"

[tasks."release:publish:dry"]
description = "Dry-Run Every Publication"
run = [
  "uv run --locked --project tools/python python -m helios_mesh_tools.release.version check",
  "uv run --locked --project tools/python python -m helios_mesh_tools.release.run dry",
  "uv run --locked --project tools/python python -m helios_mesh_tools.release.run crates-dry",
  "uv run --locked --project tools/python python -m helios_mesh_tools.test.publish --python crates/system/helios-mesh-python",
]

[tasks."release:publish:finalize"]
description = "Publish The Drafted Release"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run finalize"

[tasks."release:publish:python"]
description = "Publish Python Packages"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run python"

[tasks."release:publish:rust"]
description = "Publish Rust Crates"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run crates"

[tasks."release:rehearse"]
description = "Rehearse The Publication Chain On A Disposable Draft"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run rehearse"

[tasks."release:stage"]
description = "Stage Native Release Assets"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run stage"

[tasks."release:tag"]
description = "Tag The Rehearsed Release And Fast-Forward Main"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run tag"

[tasks."release:verify"]
description = "Verify Published Release Assets"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.release.run verify"

# === Housekeeping === #

[tasks.housekeeping]
description = "Clean Owned Build Outputs And State"
run = "uv run --locked --project tools/python python -m helios_mesh_tools.stkr project housekeeping"

[tasks."housekeeping:stats"]
description = "Count Source Lines"
run = "scc"
