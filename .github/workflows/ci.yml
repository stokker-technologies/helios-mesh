      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-latest
          display: Validate / Acceptance / Python
        - platform: windows
          runner: windows-latest
          display: Validate / Acceptance / Python (windows)
    needs:
    - build
    if: 'github.event_name == ''pull_request'' || (github.event_name == ''push'' && github.ref == ''refs/heads/dev'' && startsWith(github.event.head_commit.message,
      ''chore(release): prepare v''))'
  tests_tooling:
    name: ${{ matrix.display }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: python,uv
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - run: mise run test:python:integration --profile ${{ env.PROFILE }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: junit-python-integration-${{ matrix.platform }}
        path: target/tests/
        if-no-files-found: ignore
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-latest
          display: Validate / Integration / Python
        - platform: windows
          runner: windows-latest
          display: Validate / Integration / Python (windows)
    if: 'github.event_name == ''pull_request'' || (github.event_name == ''push'' && github.ref == ''refs/heads/dev'' && startsWith(github.event.head_commit.message,
      ''chore(release): prepare v''))'
