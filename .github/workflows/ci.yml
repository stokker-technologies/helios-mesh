        env.PROFILE }}-${{ matrix.platform }}.tar.zst --profile ${{ env.PROFILE }} --paths 5b227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f62696e222c20227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f707974686f6e222c20227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f70726f64756374225d
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
