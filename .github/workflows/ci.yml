name: CI
run-name: CI / Validation
'on':
  push:
    branches:
    - dev
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: Check / CI / Impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: impact
      uses: ./.github/actions/plan-impact
      with:
        plan: '{"dependencies":{"check":[],"build_product":[],"build_tests":[],"generated":["build_product"],"package":["build_product"],"test":["build_product","build_tests"]},"rules":[{"include":["docs/.*",".*\\.md"],"exclude":[],"jobs":["check"]}]}'
        target: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        scope: ${{ github.event_name == 'push' && 'build' || '' }}
    outputs:
      jobs: ${{ steps.impact.outputs.jobs }}
  check:
    name: Check / Product
    uses: ./.github/workflows/validate-check.yml
    needs:
    - impact
    with:
      channel: ci
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
    if: '!cancelled() && needs.impact.result == ''success'' && contains(fromJSON(needs.impact.outputs.jobs), ''check'')'
  build_product:
    name: Build / Product
    uses: ./.github/workflows/validate-build-product.yml
    needs:
    - impact
    with:
      channel: ci
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
    if: '!cancelled() && needs.impact.result == ''success'' && contains(fromJSON(needs.impact.outputs.jobs), ''build_product'')'
  build_tests:
    name: Build / Tests
    uses: ./.github/workflows/validate-build-tests.yml
    needs:
    - impact
    with:
      channel: ci
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
    if: '!cancelled() && needs.impact.result == ''success'' && contains(fromJSON(needs.impact.outputs.jobs), ''build_tests'')'
  generated:
    name: Check / Bindings / Generated
    uses: ./.github/workflows/validate-check-generated.yml
    needs:
    - impact
    - build_product
    with:
      channel: ci
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
    if: '!cancelled() && needs.impact.result == ''success'' && contains(fromJSON(needs.impact.outputs.jobs), ''generated'') && needs.build_product.result
      == ''success'''
  package:
    name: Package / Product
    uses: ./.github/workflows/validate-package.yml
    needs:
    - impact
    - build_product
    with:
      channel: ci
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
    if: '!cancelled() && needs.impact.result == ''success'' && contains(fromJSON(needs.impact.outputs.jobs), ''package'') && needs.build_product.result
      == ''success'''
  test:
    name: Test / Product
    uses: ./.github/workflows/validate-test.yml
    needs:
    - impact
    - build_product
    - build_tests
    with:
      channel: ci
      profile: ${{ startsWith(github.head_ref, 'release/v') && 'release' || 'dev' }}
    if: '!cancelled() && needs.impact.result == ''success'' && contains(fromJSON(needs.impact.outputs.jobs), ''test'') && needs.build_product.result
      == ''success'' && needs.build_tests.result == ''success'''
  required:
    name: CI / Required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
    - impact
    - check
    - build_product
    - build_tests
    - generated
    - package
    - test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Require Selected Jobs
      run: python .github/actions/plan-impact/gate.py
      env:
        RESULTS: ${{ toJSON(needs) }}
