        name: build-product-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci
    - name: Extract Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts extract --archive target/ci/build-product-${{
        env.PROFILE }}-${{ matrix.platform }}.tar.zst --profile ${{ env.PROFILE }}
    - run: mise run check:python:generated --profile ${{ env.PROFILE }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-latest
          display: Validate / Generated
        - platform: windows
          runner: windows-latest
          display: Validate / Generated (windows)
    needs:
    - freshness
    - build
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    concurrency:
      group: nightly-generated-${{ matrix.platform }}
      cancel-in-progress: true
  publish:
    name: Nightly / Publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: python,rust,uv,git-cliff
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
