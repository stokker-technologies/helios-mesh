name: CI / Nightly
run-name: Nightly / Validation
'on':
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROFILE: release
  MISE_LOCKED: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
jobs:
  freshness:
    name: Plan / Freshness
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    steps:
    - id: freshness
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'build=true

        published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"

        if [ "$published" = "$GITHUB_SHA" ]; then build=false; fi

        echo "build=$build" >> "$GITHUB_OUTPUT"'
  source:
    name: Check / Repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: go,python,uv,aqua:koalaman/shellcheck,go:github.com/rhysd/actionlint/cmd/actionlint,taplo
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - run: mise run check:repository
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    needs:
    - freshness
    concurrency:
      group: nightly-source
      cancel-in-progress: true
  check_python:
    name: Check / Python
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: node,python,uv
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - run: mise run check:python
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    needs:
    - freshness
    concurrency:
      group: nightly-check_python
      cancel-in-progress: true
  check_rust:
    name: Check / Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: rust,github:bnjbvr/cargo-machete
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - run: mise run check:rust
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-latest
        - platform: windows
          runner: windows-latest
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    needs:
    - freshness
    concurrency:
      group: nightly-check_rust-${{ matrix.platform }}
      cancel-in-progress: true
  build:
    name: Build / Product (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: python,rust,sccache,uv
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.build --profile ${{ env.PROFILE }} --output product
        --task build
    - name: Archive Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts pack --archive target/ci/build-product-${{
        env.PROFILE }}-${{ matrix.platform }}.tar.zst --profile ${{ env.PROFILE }} --paths 5b227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f62696e222c20227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f707974686f6e222c20227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f70726f64756374225d
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-product-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-product-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Archive Firmware
      if: runner.os == 'Linux'
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts pack --archive target/ci/firmware.tar.zst
        --profile ${{ env.PROFILE }} --paths 5b227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f6669726d77617265225d
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: runner.os == 'Linux'
      with:
        name: firmware-${{ env.PROFILE }}
        path: target/ci/firmware.tar.zst
        if-no-files-found: error
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-latest
        - platform: windows
          runner: windows-latest
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    needs:
    - freshness
    concurrency:
      group: nightly-build-${{ matrix.platform }}
      cancel-in-progress: true
  build_tests:
    name: Build / Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: python,rust,sccache,uv,aqua:nextest-rs/nextest/cargo-nextest
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      COMPILER_CACHE_KIND: tests
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.build --profile ${{ env.PROFILE }} --output tests
        --task build:rust:tests
    - name: Archive Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts pack --archive target/ci/build-tests-${{
        env.PROFILE }}-${{ matrix.platform }}.tar.zst --profile ${{ env.PROFILE }} --paths 5b227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f7465737473222c20227461726765742f6275696c642f7b70726f66696c657d2f7b7461726765747d2f6669787475726573225d
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-tests-${{ env.PROFILE }}-${{ matrix.platform }}
        path: target/ci/build-tests-${{ env.PROFILE }}-${{ matrix.platform }}.tar.zst
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - platform: linux
          runner: ubuntu-latest
        - platform: windows
          runner: windows-latest
    if: github.ref == 'refs/heads/dev' && needs.freshness.outputs.build == 'true'
    needs:
    - freshness
    concurrency:
      group: nightly-build_tests-${{ matrix.platform }}
      cancel-in-progress: true
  generated:
    name: ${{ matrix.display }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: python,uv
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
