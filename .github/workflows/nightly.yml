name: Nightly
run-name: Nightly / Validation
'on':
  schedule:
  - cron: 0 */4 * * *
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  freshness:
    name: Check / Nightly / Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.freshness.outputs.build }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: ./.github/actions/setup
      with:
        platform: unix
        bootstrap: '[]'
    - id: freshness
      name: Check the Published Nightly
      env:
        GH_TOKEN: ${{ github.token }}
      run: mise exec -- uv run --locked --project tools/python python .github/actions/nightly-freshness/run.py
    if: github.ref == 'refs/heads/dev'
    env:
      MISE_ENABLE_TOOLS: python,uv
  check:
    name: Check / Product
    uses: ./.github/workflows/validate-check.yml
    needs:
    - freshness
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  build_product:
    name: Build / Product
    uses: ./.github/workflows/validate-build-product.yml
    needs:
    - freshness
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  build_tests:
    name: Build / Tests
    uses: ./.github/workflows/validate-build-tests.yml
    needs:
    - freshness
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  generated:
    name: Check / Bindings / Python / Generated
    uses: ./.github/workflows/validate-check-generated.yml
    needs:
    - freshness
    - build_product
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  package:
    name: Package / Product
    uses: ./.github/workflows/validate-package.yml
    needs:
    - freshness
    - build_product
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  test:
    name: Test / Product
    uses: ./.github/workflows/validate-test.yml
    needs:
    - freshness
    - build_product
    - build_tests
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  coverage:
    name: Test / Coverage
    uses: ./.github/workflows/validate-coverage.yml
    needs:
    - freshness
    - build_product
    - build_tests
    with:
      channel: nightly
      profile: release
    if: needs.freshness.outputs.build == 'true'
  publish:
    name: Release / Publish
    uses: ./.github/workflows/publish.yml
    needs:
    - build_product
    - package
    with:
      channel: nightly
      profile: release
    permissions:
      contents: write
      actions: read
      id-token: write
  verify:
    name: Release / Verify
    uses: ./.github/workflows/verify.yml
    needs:
    - publish
    with:
      channel: nightly
      profile: release
    permissions:
      contents: read
      actions: read
  report:
    name: Release / Report / Nightly
    uses: ./.github/workflows/publish.yml
    needs:
    - freshness
    - check
    - build_product
    - build_tests
    - generated
    - package
    - test
    - coverage
    - publish
    - verify
    with:
      channel: nightly
      profile: release
      report: true
      results: ${{ toJSON(needs) }}
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: write
      actions: read
      id-token: write
