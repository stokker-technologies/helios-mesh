name: Release / Publish
'on':
  workflow_call:
    inputs:
      channel:
        description: ci, stable or nightly
        type: string
        required: true
      profile:
        description: Build Profile
        type: string
        default: dev
      build-run:
        description: Run Containing Packages
        type: string
        default: ''
      report:
        description: Append Nightly Suite Results
        type: boolean
        default: false
      results:
        description: Suite Results JSON
        type: string
        default: '{}'
permissions:
  contents: write
  actions: read
  id-token: write
env:
  PROFILE: ${{ inputs.profile }}
  MISE_LOCKED: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  CARGO_BUILD_JOBS: '6'
jobs:
  publish:
    name: ${{ inputs.report && 'Release / Report / Nightly' || 'Release / Publish / GitHub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_ENABLE_TOOLS: python,rust,uv,git-cliff
      COMPILER_CACHE_BACKEND: disk
      COMPILER_CACHE_MODE: READ_WRITE
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
      PROFILE: ${{ inputs.profile }}
    steps:
    - name: Configure Checkout Git
      run: git config --global core.longpaths true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - id: setup
      uses: ./.github/actions/setup
      with:
        platform: ${{ runner.os == 'Windows' && 'windows' || 'unix' }}
        caches: '{"mise": {"key": "helios-v1-mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''mise.lock'') }}-<RUNNER_IMAGE_ID>-<MISE_ROOT_ID>",
          "path": "<MISE_DATA_DIR>"}, "cargo_downloads": {"key": "helios-v1-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'')
          }}", "path": ".cache/cargo/registry/\n.cache/cargo/git/"}, "uv": {"key": "helios-v1-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''uv.lock'',
          ''mise.lock'') }}", "path": ".cache/uv/"}, "sccache": {"key": "helios-v1-sccache-${{ runner.os }}-${{ runner.arch }}-${{ env.PROFILE
          }}-${{ hashFiles(''Cargo.lock'', ''mise.lock'') }}", "path": ".cache/sccache/"}}'
        cache-backend: disk
        cache-mode: READ_WRITE
        bootstrap: '[]'
        free-disk: 'true'
    - name: Verify Exact Commit CI
      if: inputs.channel == 'stable' && !inputs.report
      run: mise exec -- uv run --locked --project tools/python python .github/actions/review-release/checks.py
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        RELEASE_TARGET_SHA: ${{ github.sha }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-rust-${{ env.PROFILE }}-unix
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
      if: '!inputs.report'
    - name: Extract Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts extract --archive target/ci/package-rust-${{
        env.PROFILE }}-unix.tar.zst --profile ${{ env.PROFILE }}
      if: '!inputs.report'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-rust-${{ env.PROFILE }}-windows
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
      if: '!inputs.report'
    - name: Extract Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts extract --archive target/ci/package-rust-${{
        env.PROFILE }}-windows.tar.zst --profile ${{ env.PROFILE }}
      if: '!inputs.report'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-python-${{ env.PROFILE }}-unix
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
      if: '!inputs.report'
    - name: Extract Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts extract --archive target/ci/package-python-${{
        env.PROFILE }}-unix.tar.zst --profile ${{ env.PROFILE }}
      if: '!inputs.report'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: package-python-${{ env.PROFILE }}-windows
        path: target/ci
        run-id: ${{ inputs.build-run || github.run_id }}
        github-token: ${{ github.token }}
      if: '!inputs.report'
    - name: Extract Output
      run: mise exec -- uv run --locked --project tools/python python -m helios_mesh_tools.ci.artifacts extract --archive target/ci/package-python-${{
        env.PROFILE }}-windows.tar.zst --profile ${{ env.PROFILE }}
      if: '!inputs.report'
    - run: mise run ${{ inputs.channel == 'stable' && 'release:publish' || 'release:nightly' }}
      env:
        GH_TOKEN: ${{ github.token }}
      if: '!inputs.report'
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.mise-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.mise-cache-primary-key }}
        path: ${{ steps.setup.outputs.mise-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.cargo_downloads-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.cargo_downloads-cache-primary-key }}
        path: ${{ steps.setup.outputs.cargo_downloads-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.uv-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.uv-cache-primary-key }}
        path: ${{ steps.setup.outputs.uv-path }}
    - uses: ./.github/actions/save-caches
      if: success() && github.event_name != 'pull_request' && steps.setup.outputs.sccache-cache-hit != 'true'
      with:
        key: ${{ steps.setup.outputs.sccache-cache-primary-key }}
        path: ${{ steps.setup.outputs.sccache-path }}
    - name: Append Suite Results
      if: inputs.report
      run: mise run ci:nightly-report
      env:
        GH_TOKEN: ${{ github.token }}
        RESULTS: ${{ inputs.results }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: '!inputs.report'
      with:
        name: release-manifest
        path: target/release-assets/upload.json
        if-no-files-found: error
    permissions:
      contents: write
      actions: read
      id-token: write
    concurrency:
      group: ${{ inputs.channel }}-publication-${{ github.run_id }}
      cancel-in-progress: false
    environment: ${{ inputs.channel == 'stable' && 'release' || 'nightly' }}
