    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: package-${{ env.PROFILE }}-python-linux
        path: target/ci/package-${{ env.PROFILE }}-python-linux.tar
        if-no-files-found: error
