    - run: >-
        if [ "$(id -u)" -eq 0 ]; then apt-get update && apt-get install --yes
        --no-install-recommends libudev-dev pkg-config; else sudo apt-get update && sudo apt-get
        install --yes --no-install-recommends libudev-dev pkg-config; fi
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      env:
        RUSTC_WRAPPER: ""
      with:
        install: true
        cache: false
        mise_dir: ${{ env.MISE_DATA_DIR }}
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.18.0
