name: Save Caches
description: Save Caches
inputs:
  compiler-key:
    description: Primary compiler cache key from the designated build's setup
    required: false
    default: ""
  compiler-path:
    description: Compiler cache path from setup
    required: false
    default: ""
  compiler-hit:
    description: Whether setup restored the exact compiler key
    required: false
    default: ""
  key:
    description: Key
    required: false
    default: ""
  path:
    description: Path
    required: false
    default: ""
  summary-module:
    description: Summary-module
    required: false
    default: ""
outputs: {}
runs:
  using: composite
  steps:
  - if: >-
      inputs.compiler-key != '' && inputs.compiler-path != '' && inputs.compiler-hit != 'true' &&
      github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' &&
      env.COMPILER_CACHE_MODE == 'READ_WRITE' &&
      (env.COMPILER_CACHE_KIND == 'tests' || env.COMPILER_CACHE_KIND == 'bench')
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      key: ${{ inputs.compiler-key }}
      path: ${{ inputs.compiler-path }}
  - if: inputs.path != ''
    uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      key: ${{ inputs.key }}
      path: ${{ inputs.path }}
  - shell: python
    run: |-
      import os, runpy
      runpy.run_path(os.path.join(os.environ['GITHUB_ACTION_PATH'], 'run.py'), run_name='__main__')
    env:
      SUMMARY_MODULE: ${{ inputs.summary-module }}
