[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  # Release mechanics (prepare commits and release-branch merges) are not product changes.
  { message = '^chore\(release\)', skip = true },
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^docs", group = "changed" },
  { message = "^refactor", group = "changed" },
  { message = "^perf", group = "changed" },
  { message = "^style", group = "changed" },
  { message = "^test", group = "changed" },
  { message = "^build", group = "changed" },
  { message = "^ci", group = "changed" },
  { message = "^chore", group = "changed" },
  { message = "^revert", group = "changed" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

[bump]
initial_tag = "v0.1.0"
bump_type = "patch"
breaking_always_bump_major = false
features_always_bump_minor = false
