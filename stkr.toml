# Project Policy Owned By The Hub
# Native manifests own package metadata; mise owns executable recipes.
# Defaults stay implicit. Commented sections do not declare configuration.

# === === Project === === #

[project]
name = "Helios Mesh"
visibility = "public"
platforms = ["linux", "windows"]

# === === Languages === === #

[languages.rust]
roots = ["crates"]
targets = ["thumbv6m-none-eabi"]

[languages.python]
roots = ["tools/python", "crates/system/helios-mesh-python"]
generated = ["crates/system/helios-mesh-python"]

# === === CI === === #

[ci]
mirror = true

[ci.runners]
windows = "windows-latest"
nightly = "stokker-local-linux-x64"

# === === Hooks === === #

[hooks]
step_timeout_seconds = 1200

# === === Conventions === === #

[conventions.rust]
# The PyO3 Adapter Emits An rlib For Rust Checks And Has No Independent Rust Error API.
bindings = ["helios-mesh-python"]

[barrels]
# The Public Prelude Intentionally Collects Imports For Library Consumers.
exclude = ["crates/system/helios-mesh/src/prelude.rs"]

# === === Release === === #

[release]
provider = "github"
repository = "stokker-technologies/helios-mesh"
product = "helios-mesh"
package = "helios-mesh-cli"
targets = ["linux-x86_64", "windows-x86_64"]
tests = ["unit-rust", "integration-rust", "acceptance-rust", "acceptance-python"]
crates_bootstrap_secret = "CARGO_REGISTRY_TOKEN"
# The prepare runner starts with an empty Cargo home, so the workspace lock refresh reads the index online.
lock_commands = [
  [
    "cargo",
    "update",
    "--workspace",
  ],
  [
    "uv",
    "lock",
    "--offline",
    "--project",
    "tools/python",
  ],
  [
    "uv",
    "lock",
    "--offline",
    "--project",
    "crates/system/helios-mesh-python",
  ],
]

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/helios-mesh"
name = "{product}-{version}-{target}"

[[release.assets]]
target = "windows-x86_64"
path = "target/package/{profile}/{target}/rust/helios-mesh.exe"
name = "{product}-{version}-{target}.exe"

[[release.assets]]
target = "linux-x86_64"
path = "target/package/{profile}/{target}/rust/firmware/helios-mesh-firmware-feather-rp2040.zip"
name = "{product}-{version}-{target}-firmware-feather-rp2040.zip"

[version]
value = "0.1.4"
files = ["Cargo.toml"]

# === === PyO3 === === #

[[pyo3.modules]]
name = "_native"
crate = "helios-mesh-python"
module_rename = "_native"
rust = "crates/system/helios-mesh-python/src"
stub = "crates/system/helios-mesh-python/python/helios_mesh/_native.pyi"
import = "helios_mesh._native"
root = true
flatten = ["node", "motion", "wire", "gateway", "journal"]
# Retained on the private native module for cancellation tests.
renames = { PyPendingProbe = "_PendingProbe" }
class_modules = { PyUsbDevice = "helios_mesh", PyNodeType = "helios_mesh", PyDiscoveredNode = "helios_mesh", PySidecarNode = "helios_mesh", PyGatewayNode = "helios_mesh.gateway", PyRotatorNode = "helios_mesh" }

[[pyo3.modules]]
name = "node"
crate = "helios-mesh-python"
module_rename = "node"
rust = "crates/system/helios-mesh-python/src/node"
stub = "crates/system/helios-mesh-python/python/helios_mesh/node/__init__.pyi"
import = "helios_mesh.node"

[[pyo3.modules]]
name = "motion"
crate = "helios-mesh-python"
module_rename = "motion"
rust = "crates/system/helios-mesh-python/src/motion"
stub = "crates/system/helios-mesh-python/python/helios_mesh/motion/__init__.pyi"
import = "helios_mesh.motion"

[[pyo3.modules]]
name = "wire"
crate = "helios-mesh-python"
module_rename = "wire"
rust = "crates/system/helios-mesh-python/src/motion/wire"
stub = "crates/system/helios-mesh-python/python/helios_mesh/motion/wire/__init__.pyi"
import = "helios_mesh.motion.wire"

[[pyo3.modules]]
name = "gateway"
crate = "helios-mesh-python"
module_rename = "gateway"
rust = "crates/system/helios-mesh-python/src/gateway"
stub = "crates/system/helios-mesh-python/python/helios_mesh/gateway/__init__.pyi"
import = "helios_mesh.gateway"

[[pyo3.modules]]
name = "journal"
crate = "helios-mesh-python"
module_rename = "journal"
rust = "crates/system/helios-mesh-python/src/journal"
stub = "crates/system/helios-mesh-python/python/helios_mesh/journal/__init__.pyi"
import = "helios_mesh.journal"
state_exceptions = { PyRecord = "A journal entry is paired with its cursor position and shared source metadata." }
